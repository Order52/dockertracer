<!DOCTYPE html>
<html>
<head>
    <title>Docker Topology Interactive Graph</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>
    <div class="header-container">
        <div>
            <h2>Docker Interactive Topology Graph</h2>
            <p>Drag nodes to arrange them. Scroll to zoom. Use the search box or press <b>Ctrl+F</b> to find containers.</p>
        </div>
        <div>
            <input type="text" id="searchBox" placeholder="Search container name..." />
        </div>
    </div>
    <div id="mynetwork"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
